<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#8B5E3C"/>
  
  <!-- Head -->
  <ellipse cx="32" cy="30" rx="18" ry="16" fill="#A0714F"/>
  
  <!-- Snout -->
  <ellipse cx="32" cy="38" rx="12" ry="9" fill="#C4956A"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="34" rx="5" ry="3.5" fill="#5C3A21"/>
  
  <!-- Nostrils -->
  <ellipse cx="29.5" cy="34" rx="1.2" ry="1" fill="#3D2415"/>
  <ellipse cx="34.5" cy="34" rx="1.2" ry="1" fill="#3D2415"/>
  
  <!-- Left eye -->
  <circle cx="24" cy="26" r="3.5" fill="#2D1810"/>
  <circle cx="25" cy="25" r="1.2" fill="white"/>
  
  <!-- Right eye -->
  <circle cx="40" cy="26" r="3.5" fill="#2D1810"/>
  <circle cx="41" cy="25" r="1.2" fill="white"/>
  
  <!-- Left ear -->
  <ellipse cx="16" cy="18" rx="5" ry="4" fill="#8B5E3C" transform="rotate(-20 16 18)"/>
  <ellipse cx="16" cy="18" rx="3" ry="2.5" fill="#C4956A" transform="rotate(-20 16 18)"/>
  
  <!-- Right ear -->
  <ellipse cx="48" cy="18" rx="5" ry="4" fill="#8B5E3C" transform="rotate(20 48 18)"/>
  <ellipse cx="48" cy="18" rx="3" ry="2.5" fill="#C4956A" transform="rotate(20 48 18)"/>
  
  <!-- Mouth line -->
  <path d="M28 40 Q32 43 36 40" stroke="#5C3A21" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Whisker dots left -->
  <circle cx="18" cy="36" r="1" fill="#5C3A21"/>
  <circle cx="17" cy="39" r="1" fill="#5C3A21"/>
  
  <!-- Whisker dots right -->
  <circle cx="46" cy="36" r="1" fill="#5C3A21"/>
  <circle cx="47" cy="39" r="1" fill="#5C3A21"/>
  
  <!-- Teeth (subtle) -->
  <rect x="29" y="41" width="3" height="2.5" rx="1" fill="white" opacity="0.8"/>
  <rect x="33" y="41" width="3" height="2.5" rx="1" fill="white" opacity="0.8"/>
</svg>