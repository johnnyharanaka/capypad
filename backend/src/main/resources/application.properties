quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors=${QUARKUS_HTTP_CORS:true}
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:5173}

# HTTP compression (applies to text payloads; images are already compressed binaries)
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,text/plain,text/html,text/css,application/javascript

# Connection hardening (slowloris + open-socket exhaustion)
quarkus.http.idle-timeout=${QUARKUS_HTTP_IDLE_TIMEOUT:30s}
quarkus.http.read-timeout=${QUARKUS_HTTP_READ_TIMEOUT:30s}
quarkus.http.limits.max-connections=${QUARKUS_HTTP_MAX_CONNECTIONS:200}
quarkus.http.limits.max-header-size=${QUARKUS_HTTP_MAX_HEADER_SIZE:16K}
quarkus.http.limits.max-initial-line-length=${QUARKUS_HTTP_MAX_INITIAL_LINE_LENGTH:4096}

# PostgreSQL database (overridden in test scope)
quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:postgresql}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.hibernate-orm.database.generation=${QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION:update}

# Image storage
capypad.image.storage-dir=${CAPYPAD_IMAGE_STORAGE_DIR:./data/images}
capypad.image.max-count-per-pad=${CAPYPAD_IMAGE_MAX_COUNT_PER_PAD:20}
capypad.image.max-total-bytes-per-pad=${CAPYPAD_IMAGE_MAX_TOTAL_BYTES_PER_PAD:52428800}
capypad.image.max-total-disk-bytes=${CAPYPAD_IMAGE_MAX_TOTAL_DISK_BYTES:5368709120}
capypad.image.rate-limit.uploads-per-window=${CAPYPAD_IMAGE_RATE_LIMIT_UPLOADS_PER_WINDOW:5}
capypad.image.rate-limit.window-seconds=${CAPYPAD_IMAGE_RATE_LIMIT_WINDOW_SECONDS:60}
quarkus.http.limits.max-body-size=10M

# Pad content
capypad.pad.max-content-bytes=${CAPYPAD_PAD_MAX_CONTENT_BYTES:262144}
capypad.pad.creation-rate-limit.per-window=${CAPYPAD_PAD_CREATION_RATE_LIMIT_PER_WINDOW:20}
capypad.pad.creation-rate-limit.window-seconds=${CAPYPAD_PAD_CREATION_RATE_LIMIT_WINDOW_SECONDS:3600}

# General API rate limit (per IP, covers all /api/* endpoints)
capypad.api.rate-limit.requests-per-window=${CAPYPAD_API_RATE_LIMIT_REQUESTS_PER_WINDOW:120}
capypad.api.rate-limit.window-seconds=${CAPYPAD_API_RATE_LIMIT_WINDOW_SECONDS:60}

# Security headers (defence-in-depth for API responses)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; frame-ancestors 'none'
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# CORS credentials (needed for HttpOnly cookie auth)
quarkus.http.cors.credentials=true

# HttpOnly cookie settings
capypad.auth.cookie.secure=${CAPYPAD_AUTH_COOKIE_SECURE:false}
capypad.auth.cookie.max-age-seconds=${CAPYPAD_AUTH_COOKIE_MAX_AGE:86400}
capypad.auth.cookie.same-site=${CAPYPAD_AUTH_COOKIE_SAME_SITE:Lax}

# Authentication (Keycloak via OIDC)
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/auth/realms/capypad
quarkus.oidc.client-id=backend-api
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
# Ensure we check the bearer token
quarkus.oidc.application-type=service
# Token issuer matches the external Keycloak URL (as seen by the browser)
quarkus.oidc.token.issuer=${CAPYPAD_KEYCLOAK_EXTERNAL_URL:http://localhost:8180/auth}/realms/capypad

# Disable proactive auth so @PermitAll endpoints work without a bearer token
quarkus.http.auth.proactive=false

# Allow /api/auth/* endpoints without bearer token (login, callback, logout)
quarkus.http.auth.permission.auth-public.paths=/api/auth/*
quarkus.http.auth.permission.auth-public.policy=permit

# Keycloak Admin Client (Para Quarkus criar os usuarios internamente ao dar approve)
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8180}/auth
quarkus.keycloak.admin-client.realm=master
quarkus.keycloak.admin-client.client-id=admin-cli
quarkus.keycloak.admin-client.grant-type=PASSWORD
quarkus.keycloak.admin-client.username=${KEYCLOAK_ADMIN}
quarkus.keycloak.admin-client.password=${KEYCLOAK_ADMIN_PASSWORD}

# Admin CLI setup mode
admin.setup=${ADMIN_SETUP:false}
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# OIDC redirect config (Authorization Code + PKCE)
capypad.auth.frontend-url=${CAPYPAD_FRONTEND_URL:http://localhost:5173}
capypad.auth.callback-url=${CAPYPAD_AUTH_CALLBACK_URL:http://localhost:8080/api/auth/callback}
capypad.auth.keycloak-external-url=${CAPYPAD_KEYCLOAK_EXTERNAL_URL:http://localhost:8180/auth}

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.capypad.image.storage-dir=${java.io.tmpdir}/capypad-test-images
%test.capypad.image.max-total-bytes-per-pad=200
%test.capypad.image.rate-limit.uploads-per-window=5
%test.capypad.api.rate-limit.requests-per-window=10000
%test.capypad.pad.creation-rate-limit.per-window=10000
%test.capypad.pad.max-content-bytes=1048576
