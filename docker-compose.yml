version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: capypad-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - capypad-net
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 300M

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: capypad-keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - ./backend/.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/capypad
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - ./keycloak/themes/capypad:/opt/keycloak/themes/capypad
    ports:
      - "8180:8080"
    networks:
      - capypad-net
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 500M

  backend:
    build: ./backend
    container_name: capypad-backend
    ports:
      - "8080:8080"
    volumes:
      - capypad-data:/app/data
    env_file:
      - ./backend/.env
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/capypad
    restart: unless-stopped
    networks:
      - capypad-net
    depends_on:
      - postgres
      - keycloak
    deploy:
      resources:
        limits:
          memory: 350M

networks:
  capypad-net:
    driver: bridge

volumes:
  capypad-data:
  postgres-data:
