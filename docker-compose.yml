services:
  postgres:
    image: postgres:15-alpine
    container_name: capypad-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - capypad-net
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 300M

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: capypad-keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - ./backend/.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/capypad
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - ./keycloak/themes/capypad:/opt/keycloak/themes/capypad
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - capypad-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /auth/realms/capypad/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; echo \"$$line\" | grep -q \"200\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500M

  backend:
    build: ./backend
    container_name: capypad-backend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - capypad-data:/app/data
    env_file:
      - ./backend/.env
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/capypad
      KEYCLOAK_URL: http://keycloak:8080
    restart: unless-stopped
    networks:
      - capypad-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 350M

networks:
  capypad-net:
    driver: bridge

volumes:
  capypad-data:
  postgres-data:
